# GRADE Goal: turn a product brief + one growth challenge (awareness | conversion |
# retention | referral) into 8-10 ICE-scored experiments a solo founder can start
# within two weeks. Good = valid JSON the controller can save (1-5 integer scores,
# a known channel), experiments aimed at the stated challenge, and each one concrete
# and testable (named metric, verb-first first step, under $500 to validate).
template: growthtester_backlog_v1

rubric:
  - dimension: accurate
    criterion: The experiments target the stated growth challenge for this specific product and audience, not growth in general (the prompt allows only 2-3 in adjacent areas).
  - dimension: useful
    criterion: Each experiment is concrete and testable. The hypothesis names a specific metric, and the execution note is a first step a founder could start tomorrow.
  - dimension: steerable
    criterion: ICE scores are differentiated and plausible for this product (not all the same), and no experiment needs more than $500 in ad spend to validate.

cases:
  - id: golden_awareness_devtool
    kind: golden
    segment: awareness
    variables:
      product_name: ShipFast CLI
      description: A command-line tool that scaffolds opinionated Rails 8 SaaS boilerplates with authentication, billing, and AI integrations pre-wired. Reduces new project setup from a week to under an hour.
      target_audience: Solo Rails developers building their first SaaS product
      growth_challenge: awareness
    checks:
      - { type: json_valid }
      - { type: count_between, path: experiments, min: 8, max: 10 }
      - { type: each_has_keys, path: experiments, keys: [name, hypothesis, channel, impact, confidence, effort, execution_note] }
      - { type: values_in, path: experiments, field: impact, allowed: [1, 2, 3, 4, 5] }
      - { type: values_in, path: experiments, field: confidence, allowed: [1, 2, 3, 4, 5] }
      - { type: values_in, path: experiments, field: effort, allowed: [1, 2, 3, 4, 5] }
      - { type: values_in, path: experiments, field: channel, allowed: [Content, SEO, Paid Search, Paid Social, Email, Community, Referral, Partnership, Product, Outbound, Event, PR] }
      - { type: max_chars, path: experiments.0.execution_note, value: 300, dimension: efficient }

