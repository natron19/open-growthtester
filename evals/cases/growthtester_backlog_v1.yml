      - { type: values_in, path: experiments, field: effort, allowed: [1, 2, 3, 4, 5] }
      - { type: values_in, path: experiments, field: channel, allowed: [Content, SEO, Paid Search, Paid Social, Email, Community, Referral, Partnership, Product, Outbound, Event, PR] }
      - { type: max_chars, path: experiments.0.execution_note, value: 300, dimension: efficient }

